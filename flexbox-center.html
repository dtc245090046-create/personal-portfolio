<!DOCTYPE html>
<html lang=vi>
<head>
  <meta charset=UTF-8>
  <meta name=viewport content=width=device-width, initial-scale=1.0>
  <title>Tuyệt chiêu căn giữa hoàn hảo với Flexbox</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* 3 dòng CSS cốt lõi của Flexbox để căn giữa */
    .container {
      min-height: 100vh;
      display: flex;
      justify-content: center; /* Căn giữa theo trục ngang */
      align-items: center;     /* Căn giữa theo trục dọc */
      background-color: #f0f2f5;
    }

    .center-card {
      padding: 30px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 400px;
      width: 90%;
    }

    .center-card h3 {
      color: #1e293b;
      margin-bottom: 10px;
      font-size: 1.5rem;
    }

    .center-card p {
      color: #64748b;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <div class= container>
    <div class=center-card>
      <h3>Căn giữa hoàn hảo! 🎯</h3>
      <p>Phần tử này nằm chính giữa khung nhìn màn hình.</p>
    </div>
  </div>

</body>
</html>
